<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#fb923c"/>
      <stop offset="50%"  stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#fb923c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <!-- Dark rounded background -->
  <rect width="32" height="32" rx="7" fill="#0d0d18"/>
  <!-- Soft inner glow -->
  <rect width="32" height="32" rx="7" fill="url(#glow)"/>
  <!-- fx lettering -->
  <text
    x="2.5"
    y="23"
    font-family="'SF Pro Display', 'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="20"
    font-weight="800"
    fill="url(#grad)"
    letter-spacing="-0.5"
  >fx</text>
  <!-- Shimmer underline bar -->
  <rect x="3" y="27" width="26" height="2.5" rx="1.25" fill="url(#grad)" opacity="0.6"/>
</svg>
